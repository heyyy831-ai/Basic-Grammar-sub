<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英会話のための基本英文法完全マスター サブスティチューションドリル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .progress-bar-active {
            animation: progress-shrink linear forwards;
        }
        @keyframes progress-shrink {
            from { width: 100%; }
            to { width: 0%; }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

                </div>
                <div>

                </div>
            </div>

                        <option value="0.6">0.6倍</option>
                        <option value="0.7">0.7倍</option>
                        <option value="0.8">0.8倍</option>
                        <option value="0.9">0.9倍</option>
                        <option value="1.0" selected>1.0倍 (標準)</option>
                        <option value="1.1">1.1倍</option>
                        <option value="1.2">1.2倍</option>
                        <option value="1.3">1.3倍</option>
                        <option value="1.4">1.4倍</option>

        function populateVoices() {
            const allVoices = synth.getVoices();
            if (allVoices.length === 0) return;
            
            voiceSelect.innerHTML = '';

            const badVoices = ['Fred', 'Albert', 'Bad News', 'Bahh', 'Bells', 'Boing', 'Bubbles', 'Cellos', 'Deranged', 'Good News', 'Hysterical', 'Pipe Organ', 'Trinoids', 'Whisper', 'Zarvox', 'Junior', 'Kathy', 'Princess', 'Ralph', 'Bravura', 'Superstar', 'Trickster', 'Zira', 'David', 'Mark'];

            const femalePreferred = [
                'Google US English Female', 'Google UK English Female',
                'Samantha', 'Victoria', 'Karen', 'Moira', 'Tessa', 'Serena', 'Allison', 'Ava', 'Susan', 'Zoe', 'Fiona', 'Catherine'
            ];

            const malePreferred = [
                'Google US English Male', 'Google UK English Male',
                'Alex', 'Daniel', 'Arthur', 'Rishi', 'Tom', 'Oliver', 'Bruce', 'George', 'Richard'
            ];

            let females = [];
            let males = [];

            allVoices.forEach(voice => {
                if (!voice.lang.startsWith('en')) return; 
                if (badVoices.some(bad => voice.name.includes(bad))) return;

                const fIndex = femalePreferred.findIndex(pref => voice.name.includes(pref));
                if (fIndex !== -1) {
                    females.push({ voice: voice, rank: fIndex });
                    return;
                }

                const mIndex = malePreferred.findIndex(pref => voice.name.includes(pref));
                if (mIndex !== -1) {
                    males.push({ voice: voice, rank: mIndex });
                    return;
                }
            });

            females.sort((a, b) => a.rank - b.rank);
            males.sort((a, b) => a.rank - b.rank);

            const uniqueFemales = [];
            const femaleNames = new Set();
            females.forEach(item => {
                if (!femaleNames.has(item.voice.name) && uniqueFemales.length < 5) {
                    uniqueFemales.push(item.voice);
                    femaleNames.add(item.voice.name);
                }
            });

            const uniqueMales = [];
            const maleNames = new Set();
            males.forEach(item => {
                if (!maleNames.has(item.voice.name) && uniqueMales.length < 5) {
                    uniqueMales.push(item.voice);
                    maleNames.add(item.voice.name);
                }
            });

            if (uniqueFemales.length < 5 || uniqueMales.length < 5) {
                const usedUris = new Set([...uniqueFemales.map(v => v.voiceURI), ...uniqueMales.map(v => v.voiceURI)]);
                for (const voice of allVoices) {
                    if (voice.lang.startsWith('en') && !badVoices.some(bad => voice.name.includes(bad)) && !usedUris.has(voice.voiceURI)) {
                        const vName = voice.name.toLowerCase();
                        if (vName.includes('female') && uniqueFemales.length < 5) {
                            uniqueFemales.push(voice);
                            usedUris.add(voice.voiceURI);
                        } else if (vName.includes('male') && uniqueMales.length < 5) {
                            uniqueMales.push(voice);
                            usedUris.add(voice.voiceURI);
                        } else if (uniqueFemales.length < 5) {
                            uniqueFemales.push(voice);
                            usedUris.add(voice.voiceURI);
                        } else if (uniqueMales.length < 5) {
                            uniqueMales.push(voice);
                            usedUris.add(voice.voiceURI);
                        }
                    }
                }
            }

            let femaleGroup = document.createElement('optgroup');
            femaleGroup.label = "👩 女性音声 (Female)";
            uniqueFemales.forEach((voice, index) => {
                const option = document.createElement('option');
                let cleanName = voice.name.replace(/(Microsoft|Google|- English \(.*?\))/gi, '').trim();
                if(!cleanName) cleanName = voice.name;
                let region = voice.lang.split('-')[1] || voice.lang;
                option.textContent = `Female ${index + 1} (${region} - ${cleanName})`;
                option.value = voice.voiceURI;
                femaleGroup.appendChild(option);
            });

            let maleGroup = document.createElement('optgroup');
            maleGroup.label = "👨 男性音声 (Male)";
            uniqueMales.forEach((voice, index) => {
                const option = document.createElement('option');
                let cleanName = voice.name.replace(/(Microsoft|Google|- English \(.*?\))/gi, '').trim();
                if(!cleanName) cleanName = voice.name;
                let region = voice.lang.split('-')[1] || voice.lang;
                option.textContent = `Male ${index + 1} (${region} - ${cleanName})`;
                option.value = voice.voiceURI;
                maleGroup.appendChild(option);
            });

            if (uniqueFemales.length > 0) voiceSelect.appendChild(femaleGroup);
            if (uniqueMales.length > 0) voiceSelect.appendChild(maleGroup);

            if (uniqueFemales.length === 0 && uniqueMales.length === 0) {
                 voiceSelect.innerHTML = '<option value="">英語音声が見つかりません</option>';
            }
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }
        populateVoices();

            const lessons = Object.keys(lessonData).sort((a, b) => {
                const [a1, a2] = a.replace('Lesson ', '').split('-').map(Number);
                const [b1, b2] = b.replace('Lesson ', '').split('-').map(Number);
                if (a1 !== b1) return a1 - b1;
                return a2 - b2;
            });

            for (const lesson of lessons) {
                const option = document.createElement('option');
                option.value = lesson;
                option.textContent = lesson;
                lessonSelect.appendChild(option);
            }
            populateSections(lessonSelect.value);
        }

        function populateSections(lessonName) {
            sectionSelect.innerHTML = '';
            if (!lessonName || !lessonData[lessonName]) return;
            const sections = lessonData[lessonName];
            for (const section in sections) {
                const option = document.createElement('option');
                option.value = section;
                option.textContent = `Section [${section}]`;
                sectionSelect.appendChild(option);
            }
            loadSectionData();
        }

        function loadSectionData() {
            const lesson = lessonSelect.value;
            const section = sectionSelect.value;
            if (lesson && section && lessonData[lesson][section]) {
                currentSectionData = lessonData[lesson][section];
                currentIndex = 0;
                hasPlayedCurrent = false;
                updateDisplayState();
            }
        }

        function updateDisplayState(forceHideCue = false) {
            if (currentSectionData.length === 0) return;
            
            progressText.textContent = `${currentIndex + 1} / ${currentSectionData.length}`;
            prevBtn.disabled = (currentIndex === 0);
            nextBtn.disabled = (currentIndex === currentSectionData.length - 1);
            
            if (!isPlaying || forceHideCue) {
                const item = currentSectionData[currentIndex];
                renderSentence(item.en, item.ja, "");
            }
        }

        function renderSentence(en, ja, cue) {
            displayContent.innerHTML = `
                <div class="space-y-4 w-full px-4 animate-fade-in">
                    <p class="text-xl sm:text-3xl font-extrabold text-blue-900 tracking-tight leading-tight">
                        ${en} ${cue ? `<span class="text-red-500 ml-2">${cue}</span>` : ''}
                    </p>
                    <p class="text-base sm:text-lg text-gray-600 font-medium">${ja}</p>
                </div>
            `;
        }

        function sleep(ms, signal) {
            return new Promise((resolve, reject) => {
                const timeout = setTimeout(resolve, ms);
                waitTimeout = timeout;
                if (signal) {
                    signal.addEventListener('abort', () => {
                        clearTimeout(timeout);
                        reject(new DOMException('Aborted', 'AbortError'));
                    });
                }
            });
        }

        function speakAsync(text, signal) {
            return new Promise((resolve, reject) => {
                if (signal && signal.aborted) return reject(new DOMException('Aborted', 'AbortError'));
                
                synth.cancel(); 
                
                const utterance = new SpeechSynthesisUtterance(text);
                const selectedVoiceURI = voiceSelect.value;
                if (selectedVoiceURI) {
                    const allVoices = synth.getVoices();
                    const voice = allVoices.find(v => v.voiceURI === selectedVoiceURI);
                    if (voice) utterance.voice = voice;
                }
                utterance.rate = parseFloat(speedSelect.value);

                utterance.onend = resolve;
                utterance.onerror = (e) => {
                    console.error("Speech Synthesis Error:", e);
                    resolve(); 
                };

                if (signal) {
                    signal.addEventListener('abort', () => {
                        synth.cancel();
                        reject(new DOMException('Aborted', 'AbortError'));
                    });
                }

                synth.speak(utterance);
            });
        }

        async function runDrillFlow() {
            if(!voiceSelect.value) {
                alert("Please select a voice. (指定された英語音声が利用できない環境です)");
                return;
            }

            isPlaying = true;
            togglePlayUI();
            
            abortController = new AbortController();
            const signal = abortController.signal;
            const isAutoMode = document.querySelector('input[name="play-mode"]:checked').value === 'auto';
            const waitSeconds = parseInt(waitTimeSelect.value, 10);

            try {
                while (currentIndex < currentSectionData.length && isPlaying) {
                    updateDisplayState(true); 
                    const item = currentSectionData[currentIndex];

                    renderSentence(item.en, item.ja, "");
                    
                    let spokenEn = item.en.replace(/\blive\b/gi, 'liv');
                    spokenEn = spokenEn.replace(/\blives\b/gi, 'livz');
                    await speakAsync(spokenEn, signal);
                    
                    if (item.cue) {
                        const cueWaitSeconds = parseInt(cueWaitTimeSelect.value, 10);
                        await sleep(cueWaitSeconds * 1000, signal);

                        renderSentence(item.en, item.ja, item.cue);
                        
                        let spokenCue = item.cue;
                        
                        spokenCue = spokenCue.replace(/([^,\(]+)\s*→\s*([^,\)]+)/g, (match, p1, p2) => {
                            return `Replace ${p1.trim()} with ${p2.trim()}`;
                        });
                        
                        spokenCue = spokenCue.replace(/\(-\s*/g, '(minus '); 
                        spokenCue = spokenCue.replace(/-\s*/g, 'minus '); 
                        spokenCue = spokenCue.replace(/\(\+\s*/g, '(plus '); 
                        spokenCue = spokenCue.replace(/\+\s*/g, 'plus '); 

                        spokenCue = spokenCue.replace(/[\(\)]/g, ' '); 
                        
                        spokenCue = spokenCue.replace(/\blive\b/gi, 'liv');
                        spokenCue = spokenCue.replace(/\blives\b/gi, 'livz');
                        spokenCue = spokenCue.replace(/\bread\b/gi, 'reed');
                        
                        await speakAsync(spokenCue.trim(), signal);
                    }

                    if (isAutoMode && currentIndex < currentSectionData.length - 1) {
                         startProgressBar(waitSeconds);
                         await sleep(waitSeconds * 1000, signal);
                         stopProgressBar();
                         currentIndex++;
                    } else if (isAutoMode && currentIndex === currentSectionData.length - 1) {
                         startProgressBar(waitSeconds);
                         await sleep(waitSeconds * 1000, signal);
                         stopProgressBar();
                         break;
                    } else {
                        hasPlayedCurrent = true;
                        break; 
                    }
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    console.log('Playback manually stopped/skipped');
                } else {
                    console.error('Unhandled error in drill flow', err);
                }
            } finally {
                stopProgressBar();
                if (isAutoMode || currentIndex >= currentSectionData.length - 1) {
                     if(currentIndex >= currentSectionData.length - 1 && isAutoMode) {
                        stopPlayback();
                     }
                } else {
                    isPlaying = false;
                    togglePlayUI();
                }
                
                if (!isPlaying) {
                     const item = currentSectionData[currentIndex];
                     renderSentence(item.en, item.ja, item.cue); 
                }
            }
        }

        function stopPlayback() {
            isPlaying = false;
            if (abortController) {
                abortController.abort();
            }
            if (waitTimeout) {
                clearTimeout(waitTimeout);
            }
            synth.cancel();
            stopProgressBar();
            togglePlayUI();
        }

        function togglePlayUI() {
            if (isPlaying) {
                playIcon.classList.add('hidden');
                stopIcon.classList.remove('hidden');
                playText.textContent = '停止';
                playBtn.classList.replace('bg-blue-600', 'bg-red-500');
                playBtn.classList.replace('hover:bg-blue-700', 'hover:bg-red-600');
                lessonSelect.disabled = true;
                sectionSelect.disabled = true;
            } else {
                playIcon.classList.remove('hidden');
                stopIcon.classList.add('hidden');
                playText.textContent = '再生開始';
                playBtn.classList.replace('bg-red-500', 'bg-blue-600');
                playBtn.classList.replace('hover:bg-red-600', 'hover:bg-blue-700');
                lessonSelect.disabled = false;
                sectionSelect.disabled = false;
            }
        }

        function startProgressBar(seconds) {
            timerBarContainer.classList.remove('hidden');
            timerBar.style.animation = 'none';
            timerBar.offsetHeight; 
            timerBar.style.animation = `progress-shrink ${seconds}s linear forwards`;
        }

        function stopProgressBar() {
            timerBarContainer.classList.add('hidden');
            timerBar.style.animation = 'none';
        }

        modeRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'auto') {
                    waitTimeContainer.style.opacity = '1';
                    waitTimeSelect.disabled = false;
                } else {
                    waitTimeContainer.style.opacity = '0.5';
                    waitTimeSelect.disabled = true;
                }
                hasPlayedCurrent = false;
                stopPlayback();
            });
        });

        lessonSelect.addEventListener('change', (e) => {
            stopPlayback();
            hasPlayedCurrent = false;
            populateSections(e.target.value);
        });

        sectionSelect.addEventListener('change', (e) => {
            stopPlayback();
            hasPlayedCurrent = false;
            loadSectionData();
        });

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                stopPlayback();
            } else {
                const isAutoMode = document.querySelector('input[name="play-mode"]:checked').value === 'auto';
                if (!isAutoMode && hasPlayedCurrent && currentIndex < currentSectionData.length - 1) {
                    currentIndex++;
                    hasPlayedCurrent = false;
                }
                runDrillFlow();
            }
        });

        repeatBtn.addEventListener('click', () => {
            if (currentSectionData.length > 0) {
                stopPlayback();
                hasPlayedCurrent = false;
                // 停止処理を確実に反映させるために少し待ってから再実行
                setTimeout(() => {
                    runDrillFlow();
                }, 100);
            }
        });

        nextBtn.addEventListener('click', () => {
            stopPlayback();
            if (currentIndex < currentSectionData.length - 1) {
                currentIndex++;
                hasPlayedCurrent = false;
                updateDisplayState(true);
                if(document.querySelector('input[name="play-mode"]:checked').value === 'auto') {
                     runDrillFlow();
                } else {
                     const item = currentSectionData[currentIndex];
                     renderSentence(item.en, item.ja, "");
                }
            }
        });

        prevBtn.addEventListener('click', () => {
            stopPlayback();
            if (currentIndex > 0) {
                currentIndex--;
                hasPlayedCurrent = false;
                updateDisplayState(true);
                const item = currentSectionData[currentIndex];
                renderSentence(item.en, item.ja, "");
            }
        });

        window.addEventListener('beforeunload', () => {
            synth.cancel();
        });

        populateLessons();
    </script>
</body>
</html>
